<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Maze Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🎯 Shape Maze Puzzle</h1>

    <div class="rules">
        <h3>Rules</h3>
        <p>
            Move only to a shape in the same row or column.
            The destination must share the same shape OR the same color.
            Reach the Goal tile to win!
        </p>
    </div>

    <div id="moves">Moves: 0</div>

    <div id="board"></div>

    <button onclick="restartGame()">Restart</button>

    <p id="message"></p>

    <script src="script.js"></script>

</body>
</html>
